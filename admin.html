<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resultados</title>
<style>
  :root{
    --bg:#f6f5f2;
    --card:#ffffff;
    --ink:#1f2430;
    --ink-soft:#5b6472;
    --line:#e4e1d9;
    --accent:#1f3a5f;
    --accent-soft:#eef2f7;
    --good:#2f7a4f;
    --danger:#a4392f;
    --gold:#b8860b;
    --silver:#7a7f87;
    --bronze:#9a5b32;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,20,20,.04), 0 8px 24px rgba(20,20,20,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-block:32px;
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding-inline:20px;
  }
  header.top{
    margin-bottom:24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  header.top h1{
    font-size:1.4rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top p{
    margin:2px 0 0;
    color:var(--ink-soft);
    font-size:.9rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px;
  }
  .center-card{max-width:400px;margin:60px auto;}
  label{
    display:block;
    font-size:.85rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  input[type="email"], input[type="password"]{
    width:100%;
    padding:11px 14px;
    font-size:1rem;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    margin-bottom:14px;
  }
  button{
    font:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-weight:600;
  }
  .btn-primary{background:var(--accent);color:#fff;width:100%;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--accent-soft);color:var(--accent);}
  .btn-ghost:hover{filter:brightness(0.97);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .error-msg{color:var(--danger);font-size:.85rem;margin-top:2px;margin-bottom:10px;}
  section{margin-bottom:28px;}
  h2.section-title{
    font-size:1.05rem;
    margin:0 0 14px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:.92rem;
  }
  th, td{
    text-align:left;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  th{
    color:var(--ink-soft);
    font-weight:600;
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  td.num, th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr.rank-1 td:first-child, tr.rank-2 td:first-child, tr.rank-3 td:first-child{
    font-weight:700;
  }
  .medal{margin-right:6px;}
  .rank-1 .medal{color:var(--gold);}
  .rank-2 .medal{color:var(--silver);}
  .rank-3 .medal{color:var(--bronze);}
  .avg-strong{font-weight:700;color:var(--accent);}
  .incomplete{color:var(--danger);font-size:.78rem;}
  .progress-mini{
    width:70px;
    height:6px;
    border-radius:99px;
    background:var(--line);
    overflow:hidden;
    display:inline-block;
    vertical-align:middle;
    margin-right:8px;
  }
  .progress-mini-fill{height:100%;background:var(--accent);}
  .empty-note{color:var(--ink-soft);font-size:.9rem;}
  .loading{text-align:center;color:var(--ink-soft);padding:60px 0;}
  [hidden]{display:none!important;}

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c;
      --card:#1c2028;
      --ink:#eef0f3;
      --ink-soft:#9aa3b2;
      --line:#2b303a;
      --accent:#7fa6d9;
      --accent-soft:#212a37;
      --good:#6fce9a;
      --danger:#e2887c;
      --gold:#d8b34a;
      --silver:#b7bcc4;
      --bronze:#c98a5c;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  @media (max-width:640px){
    table{font-size:.82rem;}
    th, td{padding:8px 6px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="loading">Carregando…</div>

  <section id="screen-login" class="card center-card" hidden>
    <h2 class="section-title">Painel do professor</h2>
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username" />
    <label for="password">Senha</label>
    <input type="password" id="password" autocomplete="current-password" />
    <div id="login-error" class="error-msg" hidden></div>
    <button id="login-btn" class="btn-primary">Entrar</button>
  </section>

  <div id="screen-panel" hidden>
    <header class="top">
      <div>
        <h1>Resultados</h1>
      </div>
      <div class="btn-row">
        <button id="export-btn" class="btn-ghost">Exportar CSV</button>
        <button id="logout-btn" class="btn-ghost">Sair</button>
      </div>
    </header>

    <section>
      <h2 class="section-title">Ranking</h2>
      <div id="ranking-empty" class="empty-note" hidden>Ainda não há votos registrados.</div>
      <table id="ranking-table" hidden>
        <thead>
          <tr>
            <th>Trabalho</th>
            <th class="num">Tipografia</th>
            <th class="num">Cor</th>
            <th class="num">Composição</th>
            <th class="num">Média geral</th>
            <th class="num">Votos</th>
          </tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
    </section>

    <section>
      <h2 class="section-title">Quem já votou</h2>
      <table id="voters-table">
        <thead>
          <tr>
            <th>Aluno</th>
            <th>Progresso</th>
            <th class="num">Último voto</th>
          </tr>
        </thead>
        <tbody id="voters-body"></tbody>
      </table>
    </section>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="students.js"></script>
<script src="firebase-init.js"></script>
<script>
(function(){
  "use strict";

  var loadingEl = document.getElementById("loading");
  var screenLogin = document.getElementById("screen-login");
  var screenPanel = document.getElementById("screen-panel");
  var emailEl = document.getElementById("email");
  var passwordEl = document.getElementById("password");
  var loginBtn = document.getElementById("login-btn");
  var loginError = document.getElementById("login-error");
  var logoutBtn = document.getElementById("logout-btn");
  var exportBtn = document.getElementById("export-btn");

  var rankingTable = document.getElementById("ranking-table");
  var rankingBody = document.getElementById("ranking-body");
  var rankingEmpty = document.getElementById("ranking-empty");
  var votersBody = document.getElementById("voters-body");

  var unsubVotes = null;
  var unsubVoters = null;
  var lastRanking = [];

  function showLogin(){
    loadingEl.hidden = true;
    screenLogin.hidden = false;
    screenPanel.hidden = true;
  }
  function showPanel(){
    loadingEl.hidden = true;
    screenLogin.hidden = true;
    screenPanel.hidden = false;
  }

  loginBtn.addEventListener("click", function(){
    loginError.hidden = true;
    var email = emailEl.value.trim();
    var pass = passwordEl.value;
    if (!email || !pass) return;
    loginBtn.disabled = true;
    loginBtn.textContent = "Entrando…";
    auth.signInWithEmailAndPassword(email, pass)
      .catch(function(err){
        loginError.textContent = "E-mail ou senha inválidos.";
        loginError.hidden = false;
      })
      .then(function(){
        loginBtn.disabled = false;
        loginBtn.textContent = "Entrar";
      });
  });

  passwordEl.addEventListener("keydown", function(e){
    if (e.key === "Enter") loginBtn.click();
  });

  logoutBtn.addEventListener("click", function(){
    if (unsubVotes) unsubVotes();
    if (unsubVoters) unsubVoters();
    auth.signOut();
  });

  auth.onAuthStateChanged(function(user){
    if (!user){
      showLogin();
      return;
    }
    // Tenta ler os votos; se der permission-denied, essa conta não é admin.
    attachListeners();
  });

  function attachListeners(){
    var votesData = {}; // target -> {typography:[], color:[], composition:[], count}
    var votersData = {}; // voterSlug -> {submittedCount, lastVoteAt}

    function renderAll(){
      renderRanking(votesData);
      renderVoters(votersData);
    }

    unsubVotes = db.collection("votes").onSnapshot(function(snap){
      votesData = {};
      STUDENT_SLUGS.forEach(function(s){
        votesData[s] = { typography: 0, color: 0, composition: 0, count: 0 };
      });
      snap.forEach(function(doc){
        var d = doc.data();
        if (!votesData[d.target]){
          votesData[d.target] = { typography: 0, color: 0, composition: 0, count: 0 };
        }
        votesData[d.target].typography += Number(d.typography) || 0;
        votesData[d.target].color += Number(d.color) || 0;
        votesData[d.target].composition += Number(d.composition) || 0;
        votesData[d.target].count += 1;
      });
      showPanel();
      renderRanking(votesData);
    }, function(err){
      if (err.code === "permission-denied"){
        auth.signOut();
        showLogin();
        loginError.textContent = "Esta conta não tem acesso ao painel.";
        loginError.hidden = false;
      }
    });

    unsubVoters = db.collection("voters").onSnapshot(function(snap){
      votersData = {};
      snap.forEach(function(doc){
        votersData[doc.id] = doc.data();
      });
      showPanel();
      renderVoters(votersData);
    }, function(err){
      // erro de permissão aqui já é tratado pelo listener de votes acima
    });
  }

  function renderRanking(votesData){
    var rows = STUDENT_SLUGS.map(function(slug){
      var v = votesData[slug] || { typography: 0, color: 0, composition: 0, count: 0 };
      var n = v.count;
      var avgT = n ? v.typography / n : 0;
      var avgC = n ? v.color / n : 0;
      var avgP = n ? v.composition / n : 0;
      var overall = n ? (avgT + avgC + avgP) / 3 : 0;
      return {
        slug: slug,
        name: SLUG_TO_NAME[slug] || slug,
        avgT: avgT, avgC: avgC, avgP: avgP,
        overall: overall,
        count: n,
      };
    });

    rows.sort(function(a, b){ return b.overall - a.overall; });
    lastRanking = rows;

    var anyVotes = rows.some(function(r){ return r.count > 0; });
    rankingEmpty.hidden = anyVotes;
    rankingTable.hidden = !anyVotes;
    if (!anyVotes) return;

    rankingBody.innerHTML = "";
    var maxVotes = STUDENT_SLUGS.length - 1; // 12
    rows.forEach(function(r, i){
      var tr = document.createElement("tr");
      if (i === 0) tr.className = "rank-1";
      else if (i === 1) tr.className = "rank-2";
      else if (i === 2) tr.className = "rank-3";

      var medal = "";
      if (i === 0) medal = "🥇";
      else if (i === 1) medal = "🥈";
      else if (i === 2) medal = "🥉";

      tr.innerHTML =
        "<td>" + (medal ? "<span class='medal'>" + medal + "</span>" : "") + r.name + "</td>" +
        "<td class='num'>" + r.avgT.toFixed(1) + "</td>" +
        "<td class='num'>" + r.avgC.toFixed(1) + "</td>" +
        "<td class='num'>" + r.avgP.toFixed(1) + "</td>" +
        "<td class='num avg-strong'>" + r.overall.toFixed(1) + "</td>" +
        "<td class='num'>" + r.count + "/" + maxVotes + (r.count < maxVotes ? " <span class='incomplete'>●</span>" : "") + "</td>";
      rankingBody.appendChild(tr);
    });
  }

  function renderVoters(votersData){
    var rows = STUDENT_SLUGS.map(function(slug){
      var v = votersData[slug] || {};
      return {
        slug: slug,
        name: SLUG_TO_NAME[slug] || slug,
        count: v.submittedCount || 0,
        lastVoteAt: v.lastVoteAt,
      };
    });
    rows.sort(function(a, b){
      if (a.count !== b.count) return a.count - b.count;
      return a.name.localeCompare(b.name);
    });

    var maxVotes = STUDENT_SLUGS.length - 1; // 12
    votersBody.innerHTML = "";
    rows.forEach(function(r){
      var pct = Math.min(100, Math.round((r.count / maxVotes) * 100));
      var lastStr = "—";
      if (r.lastVoteAt && r.lastVoteAt.toDate){
        lastStr = r.lastVoteAt.toDate().toLocaleString("pt-BR");
      }
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + r.name + "</td>" +
        "<td><span class='progress-mini'><span class='progress-mini-fill' style='width:" + pct + "%'></span></span>" + r.count + "/" + maxVotes + "</td>" +
        "<td class='num'>" + lastStr + "</td>";
      votersBody.appendChild(tr);
    });
  }

  exportBtn.addEventListener("click", function(){
    var maxVotes = STUDENT_SLUGS.length - 1;
    var lines = ["Trabalho;Tipografia;Cor;Composicao;Media geral;Votos recebidos"];
    lastRanking.forEach(function(r){
      lines.push([
        r.name,
        r.avgT.toFixed(1).replace(".", ","),
        r.avgC.toFixed(1).replace(".", ","),
        r.avgP.toFixed(1).replace(".", ","),
        r.overall.toFixed(1).replace(".", ","),
        r.count + "/" + maxVotes,
      ].join(";"));
    });
    var csv = lines.join("\r\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "ranking-votacao.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

})();
</script>
</body>
</html>
