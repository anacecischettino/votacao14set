<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Votação dos trabalhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f3f3f3;
    --card:#ffffff;
    --ink:#1c1e21;
    --ink-soft:#6c7178;
    --line:rgba(28,30,33,.14);
    --accent:#494e55;
    --accent-contrast:#ffffff;
    --good:#2f6b47;
    --danger:#b8492f;
    --radius:20px;
    --shadow:0 10px 24px rgba(28,30,33,.07);

    /* paleta ciclada nos cards de trabalhos - tons mais dessaturados */
    --p0-fill:#dfe1e4;
    --p1-fill:#cfdbe1;
    --p2-fill:#e2e0e4;
    --p3-fill:#ddd0e6;
    --p4-fill:#d3e2d4;
    --p5-fill:#ecd2ce;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:16px/1.55 "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-block:40px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding-inline:20px;
  }
  header.top{
    margin-bottom:32px;
  }
  header.top h1{
    font-weight:700;
    font-size:1.9rem;
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  header.top p{
    margin:0;
    color:var(--ink-soft);
    font-size:.72rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.12em;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px;
  }
  .center-card{
    max-width:440px;
    margin:0 auto;
    background:var(--p0-fill);
  }
  label{
    display:block;
    font-size:.72rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:.1em;
  }
  select{
    width:100%;
    padding:13px 14px;
    font-size:1rem;
    font-family:inherit;
    font-weight:600;
    border-radius:12px;
    border:1.5px solid rgba(23,21,18,.2);
    background:#fff;
    color:var(--ink);
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23171512' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
  }
  button{
    font:inherit;
    cursor:pointer;
    border:none;
    border-radius:99px;
    padding:14px 22px;
    font-weight:700;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-contrast);
    width:100%;
    margin-top:18px;
    font-size:.95rem;
    letter-spacing:.01em;
  }
  .btn-primary:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  .btn-primary:hover:not(:disabled){filter:brightness(1.3);}

  .progress-wrap{
    margin-bottom:26px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .progress-bar{
    height:6px;
    border-radius:99px;
    background:rgba(23,21,18,.1);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--ink);
    border-radius:99px;
    transition:width .3s ease;
  }

  .target-card{
    margin-bottom:16px;
    position:relative;
  }
  .target-card h2{
    font-size:1.15rem;
    font-weight:700;
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:12px;
    letter-spacing:-0.01em;
  }
  .avatar-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:32px;
    height:32px;
    border-radius:99px;
    background:transparent;
    border:1.5px solid rgba(23,21,18,.35);
    font-size:.85rem;
    font-weight:700;
    flex:0 0 auto;
  }
  .rating-row{
    padding:13px 0;
    border-bottom:1px solid rgba(23,21,18,.14);
  }
  .rating-row:last-of-type{border-bottom:none; padding-bottom:4px;}
  .rating-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .rating-top .cat-name{
    font-size:.72rem;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.1em;
  }
  .score-input{
    width:64px;
    flex:0 0 auto;
    padding:6px 4px 8px;
    font-size:1.1rem;
    font-family:"Sora", sans-serif;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    text-align:right;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1.5px solid rgba(23,21,18,.35);
    border-radius:0;
  }
  .score-input::placeholder{
    color:var(--ink-soft);
    font-weight:500;
    font-size:.78rem;
    opacity:.65;
  }
  .score-input:focus{
    outline:none;
    border-bottom-color:var(--ink);
  }
  .score-input.invalid{
    border-bottom-color:var(--danger);
    color:var(--danger);
  }

  /* cores cicladas dos trabalhos */
  .target-card.pastel-0{background:var(--p0-fill);}
  .target-card.pastel-1{background:var(--p1-fill);}
  .target-card.pastel-2{background:var(--p2-fill);}
  .target-card.pastel-3{background:var(--p3-fill);}
  .target-card.pastel-4{background:var(--p4-fill);}
  .target-card.pastel-5{background:var(--p5-fill);}

  .done-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.6);
    color:var(--good);
    font-size:.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:6px 12px;
    border-radius:99px;
    margin-left:auto;
  }
  .target-card.done{
    opacity:.6;
  }
  .error-msg{
    color:var(--danger);
    font-size:.85rem;
    font-weight:600;
    margin-top:10px;
  }
  .hint{
    font-size:.82rem;
    color:var(--ink-soft);
    margin-top:8px;
    line-height:1.5;
  }
  .switch-user{
    text-align:center;
    margin-top:30px;
  }
  .switch-user button{
    background:none;
    color:var(--ink-soft);
    font-size:.85rem;
    font-weight:600;
    text-decoration:underline;
    padding:6px;
  }
  .thanks{
    text-align:center;
    padding:60px 24px;
    background:var(--p4-fill);
  }
  .thanks h2{font-size:1.4rem; font-weight:700; margin:0 0 10px;}
  .thanks p{color:var(--ink-soft); font-weight:500; margin:0;}
  .loading{
    text-align:center;
    color:var(--ink-soft);
    font-weight:600;
    padding:60px 0;
  }
  [hidden]{display:none!important;}
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Votação dos trabalhos</h1>
      <p>Avaliação entre pares | Notas de 0 a 100</p>
    </header>

    <div id="loading" class="loading">Carregando…</div>

    <!-- Tela 1: identificação -->
    <section id="screen-identify" class="card center-card" hidden>
      <label for="who">Quem é você?</label>
      <select id="who">
        <option value="" disabled selected>Selecione seu nome</option>
      </select>
      <button id="confirm-who" class="btn-primary" disabled>Confirmar</button>
    </section>

    <!-- Tela 2: votação -->
    <section id="screen-vote" hidden>
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progress-text">0 de 0 concluídos</span>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
      </div>
      <div id="targets"></div>
      <div class="switch-user">
        <button id="switch-user-btn">Não é você? Trocar de aluno</button>
      </div>
    </section>

    <!-- Tela 3: agradecimento -->
    <section id="screen-thanks" class="card thanks" hidden>
      <h2>Votos registrados</h2>
      <p>Você avaliou todos os trabalhos!</p>
    </section>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="students.js"></script>
<script src="firebase-init.js"></script>
<script>
(function(){
  "use strict";

  var CATEGORIES = [
    { key: "typography", label: "Tipografia" },
    { key: "color", label: "Cor" },
    { key: "composition", label: "Composição" },
  ];

  var loadingEl = document.getElementById("loading");
  var screenIdentify = document.getElementById("screen-identify");
  var screenVote = document.getElementById("screen-vote");
  var screenThanks = document.getElementById("screen-thanks");
  var whoSelect = document.getElementById("who");
  var confirmWhoBtn = document.getElementById("confirm-who");
  var targetsEl = document.getElementById("targets");
  var progressText = document.getElementById("progress-text");
  var progressFill = document.getElementById("progress-fill");
  var switchUserBtn = document.getElementById("switch-user-btn");

  var voterSlug = null;

  function showOnly(el){
    [screenIdentify, screenVote, screenThanks].forEach(function(s){
      s.hidden = (s !== el);
    });
    loadingEl.hidden = true;
  }

  // --- Identificação ---

  STUDENTS.forEach(function(name){
    var opt = document.createElement("option");
    opt.value = slugify(name);
    opt.textContent = name;
    whoSelect.appendChild(opt);
  });

  whoSelect.addEventListener("change", function(){
    confirmWhoBtn.disabled = !whoSelect.value;
  });

  confirmWhoBtn.addEventListener("click", function(){
    if (!whoSelect.value) return;
    voterSlug = whoSelect.value;
    localStorage.setItem("voterSlug", voterSlug);
    startVoting();
  });

  switchUserBtn.addEventListener("click", function(){
    localStorage.removeItem("voterSlug");
    voterSlug = null;
    whoSelect.value = "";
    confirmWhoBtn.disabled = true;
    showOnly(screenIdentify);
  });

  // --- Ordem estável (por aluno) dos trabalhos a avaliar ---

  function seededShuffle(array, seedStr){
    var seed = 0;
    for (var i = 0; i < seedStr.length; i++){
      seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
    }
    function rand(){
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    var arr = array.slice();
    for (var j = arr.length - 1; j > 0; j--){
      var k = Math.floor(rand() * (j + 1));
      var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
    }
    return arr;
  }

  function doneKey(target){ return "vote_done__" + voterSlug + "__" + target; }

  function isDoneLocally(target){
    return localStorage.getItem(doneKey(target)) === "1";
  }

  function markDoneLocally(target){
    localStorage.setItem(doneKey(target), "1");
  }

  // --- Tela de votação ---

  function startVoting(){
    var targets = STUDENT_SLUGS.filter(function(s){ return s !== voterSlug; });
    targets = seededShuffle(targets, voterSlug);
    renderTargets(targets);
    showOnly(screenVote);
    updateProgress(targets);
  }

  function updateProgress(targets){
    var doneCount = targets.filter(isDoneLocally).length;
    progressText.textContent = doneCount + " de " + targets.length + " concluídos";
    progressFill.style.width = (targets.length ? (doneCount / targets.length * 100) : 0) + "%";
    if (doneCount === targets.length && targets.length > 0){
      setTimeout(function(){ showOnly(screenThanks); }, 400);
    }
  }

  function renderTargets(targets){
    targetsEl.innerHTML = "";
    targets.forEach(function(target, index){
      var card = buildTargetCard(target, targets, index);
      targetsEl.appendChild(card);
    });
  }

  function buildTargetCard(target, targets, index){
    var wrap = document.createElement("div");
    wrap.className = "card target-card pastel-" + (index % 6);
    wrap.id = "card__" + target;

    var already = isDoneLocally(target);
    if (already) wrap.classList.add("done");

    var displayName = SLUG_TO_NAME[target] || target;

    var title = document.createElement("h2");
    var avatar = document.createElement("span");
    avatar.className = "avatar-badge";
    avatar.textContent = displayName.charAt(0).toUpperCase();
    title.appendChild(avatar);
    var nameSpan = document.createElement("span");
    nameSpan.textContent = displayName;
    title.appendChild(nameSpan);
    if (already){
      var badge = document.createElement("span");
      badge.className = "done-badge";
      badge.textContent = "✓ enviado";
      title.appendChild(badge);
    }
    wrap.appendChild(title);

    if (already){
      return wrap;
    }

    var inputs = {};

    CATEGORIES.forEach(function(cat){
      var row = document.createElement("div");
      row.className = "rating-row";

      var top = document.createElement("div");
      top.className = "rating-top";
      var name = document.createElement("span");
      name.className = "cat-name";
      name.textContent = cat.label;

      var input = document.createElement("input");
      input.type = "text";
      input.inputMode = "numeric";
      input.pattern = "[0-9]*";
      input.maxLength = 3;
      input.className = "score-input";
      input.placeholder = "0–100";
      input.autocomplete = "off";
      input.addEventListener("input", function(){
        var digits = input.value.replace(/[^0-9]/g, "").slice(0, 3);
        if (digits !== "" && Number(digits) > 100) digits = "100";
        input.value = digits;
        input.classList.remove("invalid");
      });
      inputs[cat.key] = input;

      top.appendChild(name);
      top.appendChild(input);
      row.appendChild(top);
      wrap.appendChild(row);
    });

    var errorMsg = document.createElement("div");
    errorMsg.className = "error-msg";
    errorMsg.hidden = true;

    var submitBtn = document.createElement("button");
    submitBtn.className = "btn-primary";
    submitBtn.textContent = "Enviar nota";
    submitBtn.addEventListener("click", function(){
      var values = {};
      var allValid = true;
      CATEGORIES.forEach(function(cat){
        var raw = inputs[cat.key].value.trim();
        var n = /^[0-9]{1,3}$/.test(raw) ? parseInt(raw, 10) : NaN;
        if (isNaN(n) || n < 0 || n > 100){
          allValid = false;
          inputs[cat.key].classList.add("invalid");
        } else {
          values[cat.key] = n;
        }
      });
      if (!allValid){
        errorMsg.textContent = "Avalie cada categoria com notas de 0 a 100.";
        errorMsg.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Enviando…";
      errorMsg.hidden = true;
      submitVote(target, values)
        .then(function(){
          markDoneLocally(target);
          updateProgress(targets);
          var fresh = buildTargetCard(target, targets, index);
          wrap.replaceWith(fresh);
        })
        .catch(function(err){
          if (err && err.code === "permission-denied"){
            // Votado anteriormente.
            markDoneLocally(target);
            updateProgress(targets);
            var fresh2 = buildTargetCard(target, targets, index);
            wrap.replaceWith(fresh2);
            return;
          }
          submitBtn.disabled = false;
          submitBtn.textContent = "Enviar nota";
          errorMsg.textContent = "Não foi possível enviar. Verifique sua internet e tente de novo.";
          errorMsg.hidden = false;
        });
    });

    wrap.appendChild(submitBtn);
    wrap.appendChild(errorMsg);

    return wrap;
  }

  function submitVote(target, values){
    var data = {
      voter: voterSlug,
      target: target,
      typography: Math.round(Number(values.typography)),
      color: Math.round(Number(values.color)),
      composition: Math.round(Number(values.composition)),
      submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };
    var voteId = voterSlug + "__" + target;
    return db.collection("votes").doc(voteId).set(data).then(function(){
      return db.collection("voters").doc(voterSlug).set({
        submittedCount: firebase.firestore.FieldValue.increment(1),
        lastVoteAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
    });
  }

  // --- Autenticação e arranque ---

  auth.signInAnonymously().catch(function(err){
    loadingEl.textContent = "Não foi possível conectar. Verifique sua internet e recarregue a página.";
    console.error(err);
  });

  auth.onAuthStateChanged(function(user){
    if (!user) return;
    var saved = localStorage.getItem("voterSlug");
    if (saved && STUDENT_SLUGS.indexOf(saved) !== -1){
      voterSlug = saved;
      startVoting();
    } else {
      showOnly(screenIdentify);
    }
  });
})();
</script>
</body>
</html>
